project:
  name: elementary-school-safety-analysis
  random_seed: 42
  timezone: Asia/Seoul

paths:
  raw_data: data/raw
  external_data: data/external
  interim_data: data/interim
  processed_data: data/processed
  outputs: outputs

data:
  target_population: elementary_school_students
  inclusion_rule: "school_level == 초등학교"
  privacy:
    minimum_reporting_cell_size: 5
    allow_school_level_export: false

association_rules:
  transaction_columns:
    - place
    - activity_period
    - accident_type
    - activity
    - grade
  min_support: 0.01
  min_confidence: 0.30
  min_lift: 1.00

scoring:
  name: preventive_priority_score
  weights:
    frequency: 0.40
    association: 0.30
    severity: 0.30

reporting:
  language: ko
  figure_dpi: 200
